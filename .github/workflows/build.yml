name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: دانلود فونت فارسی
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Vazirmatn-Regular.ttf https://github.com/rastikerdar/vazirmatn/raw/main/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L -o assets/fonts/Vazirmatn-Bold.ttf https://github.com/rastikerdar/vazirmatn/raw/main/fonts/ttf/Vazirmatn-Bold.ttf
          ls -la assets/fonts/

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت پوشه‌های اندروید (در صورت نبود)
        run: flutter create --platforms=android .

      - name: افزودن مجوز اعلان به AndroidManifest
        run: |
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\\n    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: فعال‌سازی Core Library Desugaring
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi
          python3 - "$GRADLE_FILE" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          is_kts = path.endswith(".kts")
          if "compileOptions {" in content:
              flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
              content = content.replace("compileOptions {", f"compileOptions {{\n        {flag}", 1)
          dep_line = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if is_kts else
              'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          )
          if "dependencies {" in content:
              content = content.replace("dependencies {", f"dependencies {{\n    {dep_line}", 1)
          else:
              content = content.rstrip() + f"\n\ndependencies {{\n    {dep_line}\n}}\n"
          with open(path, "w") as f:
              f.write(content)
          PYEOF

      - name: تولید کد دیتابیس (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: ساخت APK (نسخه Release)
        run: flutter build apk --release

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamirino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
