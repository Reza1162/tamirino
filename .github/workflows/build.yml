name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت پوشه‌های اندروید (در صورت نبود)
        run: flutter create --platforms=android .

      - name: افزودن مجوز اعلان به AndroidManifest
        run: |
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml

      - name: فعال‌سازی Core Library Desugaring
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi
          echo "Using $GRADLE_FILE"
          if grep -q "kts" <<< "$GRADLE_FILE"; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$GRADLE_FILE"
            sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$GRADLE_FILE"
          else
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$GRADLE_FILE"
            sed -i '/^dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' "$GRADLE_FILE"
          fi
          cat "$GRADLE_FILE" | grep -A2 -B2 desugar

      - name: تولید کد دیتابیس (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: ساخت APK (نسخه Release)
        run: flutter build apk --release

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamirino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
