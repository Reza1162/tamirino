name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت پوشه‌های اندروید (در صورت نبود)
        run: flutter create --platforms=android .

      - name: افزودن مجوز اعلان به AndroidManifest
        run: |
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml

      - name: فعال‌سازی Core Library Desugaring
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi
          echo "Using $GRADLE_FILE"
          cat "$GRADLE_FILE"
          python3 - "$GRADLE_FILE" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          is_kts = path.endswith(".kts")

          if is_kts:
              if "compileOptions {" in content:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
          else:
              if "compileOptions {" in content:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1,
                  )
              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                      1,
                  )

          with open(path, "w") as f:
              f.write(content)

          print("patched OK")
          PYEOF

      - name: تولید کد دیتابیس (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: ساخت APK (نسخه Release)
        run: flutter build apk --release

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamirino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
